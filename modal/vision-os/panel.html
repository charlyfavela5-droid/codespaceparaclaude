<title>Visión OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Concepto: consola operativa de agencia. Barra de pestañas arriba, tarjetas de cliente con medidor de entrega (1 video + 3 imágenes). */
:root{--bg:#f3f5f4;--panel:#ffffff;--fg:#14211f;--muted:#5d6b68;--line:#dbe2df;--accent:#0f766e;--accent-fg:#ffffff;--ok:#2f7d4f;--warn:#a76a00;--bad:#b3392f;--chip:#e6eeec;--font-d:"Space Grotesk",system-ui,sans-serif;--font-b:Inter,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--panel:#161f1d;--fg:#e6efed;--muted:#97a8a4;--line:#26332f;--accent:#2dd4bf;--accent-fg:#06201c;--ok:#5fcf8c;--warn:#e0a63a;--bad:#f0746a;--chip:#1f2c29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1514;--panel:#161f1d;--fg:#e6efed;--muted:#97a8a4;--line:#26332f;--accent:#2dd4bf;--accent-fg:#06201c;--ok:#5fcf8c;--warn:#e0a63a;--bad:#f0746a;--chip:#1f2c29;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-b);padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
h1{font:700 22px var(--font-d);margin:0;letter-spacing:-.01em}
h2{font:700 16px var(--font-d);margin:0}
.sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:500 14px var(--font-b);padding:10px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0;overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--chip);font-size:12px;font-weight:600}
.pill.alta,.pill.campaña{color:var(--bad)}.pill.media,.pill.seguimiento{color:var(--warn)}.pill.hecho,.pill.baja{color:var(--ok)}
.meter{display:flex;flex-direction:column;gap:4px}
.meter span{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.meter i{display:block;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.meter i b{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item p{margin:0;overflow-wrap:anywhere}
.empty{border:1px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted)}
.note{background:var(--chip);border-radius:8px;padding:12px;color:var(--muted)}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--fg);width:100%}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpis{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.kpis b{color:var(--fg);font-family:var(--font-d);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
@media (max-width:480px){.two{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <header>
    <div><h1>Visión OS</h1><div class="sub" id="mode">Conectando…</div></div>
    <div class="kpis" id="kpis"></div>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
const PHASES=["campaña","video","imágenes","seguimiento","pausa"];
const TABS=[["clients","Clientes"],["tasks","Pendientes"],["inbox","WhatsApp"],["prospects","Prospectos"],["meta","Meta Ads"],["github","GitHub"]];
const SEED={clients:[
 ["Mariano","Casas","Terminar video; el gancho tiene la voz desincronizada, arreglar con MiniMax.","video"],
 ["Jesús (Rar Amore)","Cápsulas con resveratrol","Ya recibió video e imágenes; propone anuncios nuevos.","campaña"],
 ["Empeños","Empeños","Decidió hacer 1 video; imágenes bien.","video"],
 ["Renova","Renova","Audio aprobado; faltan frames y referencia visual.","video"],
 ["Ginecólogo","Consultorio","Video virgen sin subtítulos; quiere llegar a 9.","video"],
 ["Alberto","Dentista","Video pendiente.","video"],
 ["Caser","Caser","Video pendiente.","video"],
 ["Manuel Fotografía","Fotografía","Contento con su video; corregir un número que la IA quitó.","seguimiento"],
 ["Rafael","—","Campaña sin resultado; pide promoción Buen Fin; se le debe un video.","campaña"],
 ["José","—","Prueba social subida; mensajes cuestan $30; busca referencias.","seguimiento"]]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let store=null, mode="", state={clients:[],tasks:[],inbox:[],prospects:[]}, tab="clients";

function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

/* ---- almacenamiento: db del artefacto o API de Modal ---- */
async function pickStore(){
  let db=null;
  try{ if(window.claude?.use){ db=await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),3000))]); } }catch(e){}
  if(db){
    mode="db";
    return {
      sub(coll,cb){ if(coll==="inbox")return; db.collection(coll).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),()=>cb([])); },
      async save(coll,doc){ const id=doc.id||Math.random().toString(36).slice(2,12); const{id:_,...rest}=doc; await db.doc(coll+"/"+id).set({...rest,updatedAt:Date.now()}); },
      async del(coll,id){ await db.doc(coll+"/"+id).delete(); }
    };
  }
  mode="api";
  let key=""; try{key=localStorage.getItem("vos-key")||""}catch(e){}
  const call=async(path,opt={})=>{
    const r=await fetch(path,{...opt,headers:{"X-Admin-Key":key,"Content-Type":"application/json"}});
    if(r.status===401){ throw new Error("auth"); }
    const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.detail||r.status); return j; };
  window.api=call;
  const login=async()=>{
    while(true){
      try{ await call("/api/ping"); return; }catch(e){
        if(e.message!=="auth") throw e;
        key=await askKey(); try{localStorage.setItem("vos-key",key)}catch(_){}
      } } };
  await login();
  return {
    async sub(coll,cb){ const load=async()=>{try{cb(await call("/api/"+coll))}catch(e){}}; load(); setInterval(load,15000); },
    async save(coll,doc){ await call("/api/"+coll,{method:"POST",body:JSON.stringify(doc)}); store.reload(coll); },
    async del(coll,id){ await call("/api/"+coll+"/"+id,{method:"DELETE"}); store.reload(coll); },
    reload(coll){ call("/api/"+coll).then(d=>{state[coll]=d;render()}).catch(()=>{}); }
  };
}
function askKey(){ return new Promise(res=>{
  $("#frm").innerHTML=`<h2>Clave del panel</h2><p class="sub">Es la ADMIN_KEY que guardaste en el secreto de Modal.</p><label>Clave<input id="k" type="password" autocomplete="current-password"></label><button class="btn" value="ok">Entrar</button>`;
  const d=$("#dlg"); d.showModal(); d.addEventListener("close",()=>res($("#k").value),{once:true}); }); }

/* ---- formularios ---- */
const FIELDS={
 clients:[["name","Nombre"],["business","Negocio"],["phone","WhatsApp (con lada)"],["phase","Fase","select",PHASES],["videos","Videos en 8","number"],["images","Imágenes en 8","number"],["metaAccount","Cuenta Meta (act_…)"],["note","Nota","area"]],
 tasks:[["title","Pendiente"],["status","Estado","select",["pendiente","en curso","hecho"]],["category","Tipo","select",["anuncio","campaña","seguimiento","prospecto","otro"]],["clientName","Cliente"]],
 prospects:[["name","Nombre"],["business","Negocio"],["phone","WhatsApp"],["stage","Etapa","select",["nuevo","contactado","muestra enviada","cerrado","perdido"]],["sample","Muestra gratis","select",["pendiente","en proceso","entregada"]],["notes","Notas","area"]]
};
function openForm(coll,doc={}){
  const f=FIELDS[coll];
  $("#frm").innerHTML=`<h2>${doc.id?"Editar":"Nuevo"}</h2>`+f.map(([k,l,t,o])=>{
    const v=esc(doc[k]??"");
    if(t==="select") return `<label>${l}<select name="${k}">${o.map(x=>`<option ${x===doc[k]?"selected":""}>${x}</option>`).join("")}</select></label>`;
    if(t==="area") return `<label>${l}<textarea name="${k}">${v}</textarea></label>`;
    return `<label>${l}<input name="${k}" type="${t||"text"}" value="${v}"></label>`;}).join("")
   +`<div class="row"><button class="btn ghost" value="cancel" formnovalidate>Cancelar</button><button class="btn" value="ok">Guardar</button></div>`;
  const d=$("#dlg"); d.showModal();
  d.addEventListener("close",async()=>{ if(d.returnValue!=="ok")return;
    const o={...doc}; for(const[k,,t]of f){ const e=$("#frm").elements[k]; o[k]=t==="number"?Number(e.value||0):e.value; }
    try{ await store.save(coll,o); toast("Guardado"); }catch(e){ toast("No se pudo guardar"); } },{once:true});
}
async function del(coll,id){ if(!confirm2(id))return; try{await store.del(coll,id);toast("Eliminado")}catch(e){toast("No se pudo eliminar")} }
const pendingDel={};
function confirm2(id){ if(pendingDel[id]){delete pendingDel[id];return true} pendingDel[id]=1; toast("Toca otra vez para eliminar"); setTimeout(()=>delete pendingDel[id],3000); return false; }

/* ---- vistas ---- */
const meter=(l,v,t)=>`<div class="meter"><span>${l}<b>${v}/${t}</b></span><i><b style="width:${Math.min(100,v/t*100)}%"></b></i></div>`;
function vClients(){
  const c=state.clients;
  return `<div class="bar"><h2>Clientes</h2><button class="btn" data-new="clients">Nuevo cliente</button></div>`+
  (c.length?`<div class="grid">${c.map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="pill ${esc(x.phase)}">${esc(x.phase)}</span></div>
   <div class="sub">${esc(x.business)}</div><p>${esc(x.note)}</p>${meter("Videos",x.videos||0,1)}${meter("Imágenes",x.images||0,3)}
   <div class="row"><button class="btn ghost" data-edit="clients:${x.id}">Editar</button><button class="btn danger" data-del="clients:${x.id}">Eliminar</button></div></div>`).join("")}</div>`
  :`<div class="empty">Aún no hay clientes. Agrega el primero con “Nuevo cliente”.</div>`);
}
function vTasks(){
  const t=state.tasks;
  return `<div class="bar"><h2>Pendientes</h2><button class="btn" data-new="tasks">Nuevo pendiente</button></div>`+
  (t.length?`<div class="list">${t.map(x=>`<div class="item"><div class="row"><b>${esc(x.title)}</b><span class="pill ${esc(x.status==="hecho"?"hecho":x.category)}">${esc(x.status)}</span></div>
   <div class="sub">${esc(x.category)}${x.clientName?" · "+esc(x.clientName):""}</div>
   <div class="row"><button class="btn ghost" data-done="${x.id}">${x.status==="hecho"?"Reabrir":"Marcar hecho"}</button><span><button class="btn ghost" data-edit="tasks:${x.id}">Editar</button> <button class="btn danger" data-del="tasks:${x.id}">Eliminar</button></span></div></div>`).join("")}</div>`
  :`<div class="empty">Sin pendientes. Cuando llegue un mensaje de campaña o urgente, el COO crea uno aquí.</div>`);
}
function vProspects(){
  const p=state.prospects;
  return `<div class="bar"><h2>Prospectos y muestras gratis</h2><button class="btn" data-new="prospects">Nuevo prospecto</button></div>`+
  (p.length?`<div class="grid">${p.map(x=>`<div class="card"><div class="row"><b>${esc(x.name||x.phone)}</b><span class="pill">${esc(x.stage)}</span></div>
   <div class="sub">${esc(x.business)} ${x.phone?"· "+esc(x.phone):""}</div><p>${esc(x.notes)}</p><div class="sub">Muestra: ${esc(x.sample)}</div>
   <div class="row"><button class="btn ghost" data-edit="prospects:${x.id}">Editar</button><button class="btn danger" data-del="prospects:${x.id}">Eliminar</button></div></div>`).join("")}</div>`
  :`<div class="empty">Sin prospectos. Los números desconocidos que escriban por WhatsApp aparecerán aquí con su muestra gratis pendiente.</div>`);
}
function vInbox(){
  const m=state.inbox;
  return `<div class="bar"><h2>Bandeja de WhatsApp</h2><span class="sub">El COO clasifica y deja una respuesta sugerida. Tú apruebas el envío.</span></div>`+
  (m.length?`<div class="list">${m.map(x=>`<div class="item"><div class="row"><b>${esc(x.name||x.phone)}</b><span><span class="pill ${esc(x.category)}">${esc(x.category)}</span> <span class="pill ${esc(x.urgency)}">${esc(x.urgency)}</span></span></div>
   <p>${esc(x.text)}</p>${x.missing?.length?`<div class="sub">Falta: ${esc(x.missing.join(", "))}</div>`:""}
   <label>Respuesta sugerida (${esc(x.by)})<textarea id="d-${x.id}">${esc(x.draft)}</textarea></label>
   <div class="row"><span class="sub">${x.sent?"Enviado":"Sin enviar"}</span><button class="btn" data-send="${x.id}" ${x.sent?"disabled":""}>Enviar por WhatsApp</button></div></div>`).join("")}</div>`
  :`<div class="empty">Sin mensajes todavía. Apunta el webhook de WaAPI a /webhook/&lt;WEBHOOK_SECRET&gt; de tu app en Modal.</div>`);
}
function offline(name){return `<div class="note">${name} necesita el backend de Modal. Abre este mismo panel desde la URL de tu app en Modal (modal deploy app.py) y esta pestaña se activa sola.</div>`}
function vMeta(){
  if(mode!=="api")return offline("Meta Ads");
  const c=state.clients.filter(x=>/^act_\d+$/.test(x.metaAccount||""));
  return `<div class="bar"><h2>Meta Ads por cliente</h2></div>`+(c.length?`<div class="tbl"><table><thead><tr><th>Cliente</th><th>Gasto</th><th>Clics</th><th>CTR</th><th>CPC</th><th></th></tr></thead><tbody>${c.map(x=>`<tr id="m-${x.id}"><td>${esc(x.name)}</td><td colspan="4" class="sub">—</td><td><button class="btn ghost" data-meta="${x.id}">Cargar 7 días</button></td></tr>`).join("")}</tbody></table></div>`
   :`<div class="empty">Agrega la cuenta (act_123…) en la ficha de un cliente para ver su gasto y clics aquí.</div>`);
}
let repos=null;
function vGithub(){
  if(mode!=="api")return offline("GitHub");
  if(!repos) return `<div class="bar"><h2>GitHub</h2></div><div class="note">Cargando repos…</div>`;
  if(repos.error) return `<div class="bar"><h2>GitHub</h2></div><div class="note">${esc(repos.error)}. Revisa GITHUB_TOKEN en el secreto de Modal.</div>`;
  return `<div class="bar"><h2>GitHub</h2><button class="btn ghost" data-repos>Actualizar</button></div><div class="grid">${repos.map(r=>`<div class="card"><div class="row"><b>${esc(r.full_name)}</b><span class="pill">${r.private?"privado":"público"}</span></div>
   <div class="sub">${r.open_issues} issues abiertos · último push ${new Date(r.pushed_at).toLocaleDateString("es-MX")}</div><div id="s-${esc(r.full_name)}" class="sub"></div>
   <div class="row"><button class="btn ghost" data-status="${esc(r.full_name)}">Ver estado</button><button class="btn" data-deploy="${esc(r.full_name)}">Desplegar</button></div></div>`).join("")}</div>`;
}
const VIEWS={clients:vClients,tasks:vTasks,prospects:vProspects,inbox:vInbox,meta:vMeta,github:vGithub};

function render(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join("");
  const open=state.tasks.filter(t=>t.status!=="hecho").length, unread=state.inbox.filter(m=>!m.read&&!m.sent).length;
  $("#kpis").innerHTML=`<span><b>${state.clients.length}</b> clientes</span><span><b>${open}</b> pendientes</span><span><b>${state.prospects.length}</b> prospectos</span>${mode==="api"?`<span><b>${unread}</b> por responder</span>`:""}`;
  $("#view").innerHTML=VIEWS[tab]();
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b)return; const d=b.dataset;
  if(d.tab){tab=d.tab;render(); if(tab==="github"&&mode==="api"&&!repos)loadRepos(); return}
  if(d.new){openForm(d.new);return}
  if(d.edit){const[c,id]=d.edit.split(":");openForm(c,state[c].find(x=>x.id===id));return}
  if(d.del){const[c,id]=d.del.split(":");del(c,id);return}
  if(d.done){const t=state.tasks.find(x=>x.id===d.done);await store.save("tasks",{...t,status:t.status==="hecho"?"pendiente":"hecho"});return}
  if(d.send){const m=state.inbox.find(x=>x.id===d.send);b.disabled=true;
    try{await api("/api/send",{method:"POST",body:JSON.stringify({chatId:m.chatId,text:$("#d-"+m.id).value,inboxId:m.id})});toast("Enviado");store.reload("inbox")}catch(err){b.disabled=false;toast("No se pudo enviar: "+err.message)} return}
  if(d.meta){const c=state.clients.find(x=>x.id===d.meta);
    try{const r=(await api("/api/meta/insights?account="+c.metaAccount)).data?.[0]||{};
      $("#m-"+c.id).innerHTML=`<td>${esc(c.name)}</td><td>$${esc(r.spend??"0")}</td><td>${esc(r.clicks??"0")}</td><td>${esc((+r.ctr||0).toFixed(2))}%</td><td>$${esc((+r.cpc||0).toFixed(2))}</td><td></td>`}catch(err){toast("Meta: "+err.message)} return}
  if(d.repos!==undefined){repos=null;render();loadRepos();return}
  if(d.status){try{const s=await api("/api/github/status?repo="+encodeURIComponent(d.status));
    document.getElementById("s-"+d.status).innerHTML=s.commits.map(c=>`${esc(c.sha)} ${esc(c.msg)}`).join("<br>")+"<br>"+(s.runs.map(r=>`${esc(r.name)}: ${esc(r.conclusion||r.status)}`).join(" · ")||"Sin workflows")}catch(err){toast(err.message)} return}
  if(d.deploy){ if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirmar despliegue";setTimeout(()=>{b.dataset.armed="";b.textContent="Desplegar"},4000);return}
    b.disabled=true; try{const r=await api("/api/github/deploy",{method:"POST",body:JSON.stringify({repo:d.deploy})});toast("Despliegue lanzado ("+r.via+")")}catch(err){toast("Error: "+err.message)} b.disabled=false;b.dataset.armed="";b.textContent="Desplegar"; return}
});
async function loadRepos(){ try{repos=await api("/api/github/repos")}catch(e){repos={error:e.message}} if(tab==="github")render(); }

async function boot(){
  render();
  try{ store=await pickStore(); }catch(e){ $("#mode").textContent="No se pudo conectar: "+e.message; return; }
  $("#mode").textContent=mode==="db"?"Modo artefacto · fichas, pendientes y prospectos":"Conectado a Modal · WhatsApp, Meta Ads y GitHub activos";
  for(const c of ["clients","tasks","prospects","inbox"]) store.sub(c,d=>{state[c]=d;render()});
  render();
}
boot();
</script>
